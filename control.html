<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parlayberg Control</title>
<style>body{font-family:Arial;background:#07110b;color:white;padding:24px}main{max-width:760px;margin:auto}h1{color:#2cff73}.box{background:#0c1d13;border:1px solid #2cff73;padding:18px;border-radius:16px;margin:14px 0}input{padding:12px;margin:5px;width:42%;background:#06100b;color:white;border:1px solid #456;border-radius:8px}button{padding:12px 16px;margin:5px;background:#2cff73;border:0;border-radius:8px;font-weight:700}.score{font-size:52px;font-weight:900}.ok{color:#2cff73}</style>
<main><h1>PARLAYBERG LIVE CONTROL</h1>
<div class="box"><input id="homeTeam" placeholder="Home team"><input id="awayTeam" placeholder="Away team"><br><input id="clock" placeholder="00:00"><button onclick="save()">UPDATE MATCH</button></div>
<div class="box"><div class="score"><span id="hs">0</span> - <span id="as">0</span></div>
<button onclick="goal('homeScore',1)">HOME +1</button><button onclick="goal('homeScore',-1)">HOME -1</button><button onclick="goal('awayScore',1)">AWAY +1</button><button onclick="goal('awayScore',-1)">AWAY -1</button></div>
<div class="box"><b>TikTok overlay URL:</b><br><span id="u"></span><p id="status" class="ok"></p></div></main>
<script>
let s={homeTeam:'HOME TEAM',awayTeam:'AWAY TEAM',homeScore:0,awayScore:0,clock:'00:00'};
async function load(){try{s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());draw();status.textContent='Connected'}catch(e){status.textContent='Connection error'}}
function draw(){homeTeam.value=s.homeTeam;awayTeam.value=s.awayTeam;clock.value=s.clock;hs.textContent=s.homeScore;as.textContent=s.awayScore;u.textContent=location.origin+'/overlay.html'}
async function post(x){await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});await load()}
function save(){post({homeTeam:homeTeam.value||'HOME TEAM',awayTeam:awayTeam.value||'AWAY TEAM',clock:clock.value||'00:00'})}
function goal(k,d){post({[k]:Math.max(0,(+s[k]||0)+d)})}
load();
</script>
