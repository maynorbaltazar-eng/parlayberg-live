<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parlayberg Control</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110b;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:22px}
main{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
h1{margin:0;color:#39ff7a}.box{background:#0b1a11;border:1px solid #2dff70;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 0 20px #00ff6630}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
input{width:100%;padding:12px;background:#07110b;border:1px solid #335c43;color:white;border-radius:9px;font-size:15px}
button{padding:12px 16px;border:0;border-radius:9px;background:#2cff73;font-weight:800;cursor:pointer}.danger{background:#ff3b3b;color:white}
.score{font-size:54px;font-weight:900;text-align:center;margin:10px}.muted{color:#a6b7ac}.ok{color:#39ff7a}.clockPanel{text-align:center;margin:14px 0;padding:14px;border:1px solid #335c43;border-radius:12px;background:#07110b}.clockBig{font-size:38px;font-weight:900;color:#39ff7a;margin-bottom:10px}.clockBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.warn{background:#ffc928;color:#111}.secondary{background:#183b26;color:#fff;border:1px solid #2cff73}
label{font-size:12px;color:#b7c8bd;display:block;margin:2px 0 5px}.sectionTitle{font-size:18px;font-weight:900;color:#39ff7a;margin-bottom:12px}.logoPreview{width:72px;height:72px;object-fit:contain;background:#07110b;border:1px solid #335c43;border-radius:10px;padding:6px;margin-top:8px}
@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}
</style></head><body><main>
<div class="top"><div><h1>PARLAYBERG LIVE CONTROL</h1><div class="muted">TikTok Match Center</div></div><div id="status" class="ok"></div></div>

<div class="box">
<div class="sectionTitle">Main Match</div>
<div class="grid3"><div><label>Home team</label><input id="homeTeam"></div><div><label>Match clock</label><input id="clock" readonly></div><div><label>Away team</label><input id="awayTeam"></div></div>
<div class="clockPanel">
<div id="clockBig" class="clockBig">00:00</div>
<div id="clockModeLabel" class="muted" style="margin-bottom:10px">STANDARD 90 MIN</div>
<div class="clockBtns">
<button type="button" onclick="clockAction('start')">▶ START</button>
<button type="button" class="warn" onclick="clockAction('pause')">⏸ PAUSE</button>
<button type="button" class="danger" onclick="clockAction('reset')">↺ RESET</button>
<button type="button" class="secondary" onclick="clockAction('add_minute')">+1 MIN</button>
<button type="button" class="secondary" onclick="clockAction('subtract_minute')">-1 MIN</button>
<button type="button" class="warn" onclick="clockAction('extra')">⚽ START EXTRA TIME +30</button>
</div>
<div class="muted" style="margin-top:10px;font-size:12px">Standard mode runs past 90:00 as added time. Extra Time starts at 90:00, runs to 120:00, then continues as added time.</div>
</div>
<div class="grid" style="margin-top:10px">
<div>
<label>Home team logo</label>
<input id="homeLogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="pickLogo(this,'homeLogo','homeLogoPreview')">
<input id="homeLogo" type="hidden">
<img id="homeLogoPreview" class="logoPreview" alt="Home logo preview">
<button type="button" class="danger" style="margin-top:8px" onclick="clearLogo('homeLogo','homeLogoPreview','homeLogoFile')">REMOVE HOME LOGO</button>
</div>
<div>
<label>Away team logo</label>
<input id="awayLogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="pickLogo(this,'awayLogo','awayLogoPreview')">
<input id="awayLogo" type="hidden">
<img id="awayLogoPreview" class="logoPreview" alt="Away logo preview">
<button type="button" class="danger" style="margin-top:8px" onclick="clearLogo('awayLogo','awayLogoPreview','awayLogoFile')">REMOVE AWAY LOGO</button>
</div>
</div>
<div class="score"><span id="hs">0</span> - <span id="as">0</span></div>
<div style="text-align:center"><button onclick="goal('homeScore',1)">HOME +1</button><button class="danger" onclick="goal('homeScore',-1)">HOME -1</button><button onclick="goal('awayScore',1)">AWAY +1</button><button class="danger" onclick="goal('awayScore',-1)">AWAY -1</button></div>
</div>

<div class="box"><div class="sectionTitle">Live Stats</div>
<div class="grid">
<div><label>Possession Home</label><input id="possessionHome"></div><div><label>Possession Away</label><input id="possessionAway"></div>
<div><label>Shots Home</label><input id="shotsHome"></div><div><label>Shots Away</label><input id="shotsAway"></div>
<div><label>Shots on Target Home</label><input id="sotHome"></div><div><label>Shots on Target Away</label><input id="sotAway"></div>
<div><label>Corners Home</label><input id="cornersHome"></div><div><label>Corners Away</label><input id="cornersAway"></div>
<div><label>Fouls Home</label><input id="foulsHome"></div><div><label>Fouls Away</label><input id="foulsAway"></div>
<div><label>Yellow Cards Home</label><input id="yellowHome"></div><div><label>Yellow Cards Away</label><input id="yellowAway"></div>
<div><label>Red Cards Home</label><input id="redHome"></div><div><label>Red Cards Away</label><input id="redAway"></div>
</div></div>

<div class="box"><div class="sectionTitle">Recent Events</div><div class="grid">
<input id="event1" placeholder="23' | GOAL - Home"><input id="event2"><input id="event3"><input id="event4"><input id="event5">
</div></div>

<div class="box"><div class="sectionTitle">Today's Matches</div><div class="grid">
<input id="match1" placeholder="Team A vs Team B • 12:30"><input id="match2"><input id="match3"><input id="match4"><input id="match5">
</div></div>

<div class="box"><button onclick="saveAll()">UPDATE OVERLAY</button>
<p class="muted">TikTok overlay URL:<br><b id="u" style="color:#39ff7a"></b></p></div>
</main>
<script>
let s={};const fields=['homeTeam','awayTeam','homeLogo','awayLogo','clock','possessionHome','possessionAway','shotsHome','shotsAway','sotHome','sotAway','cornersHome','cornersAway','foulsHome','foulsAway','yellowHome','yellowAway','redHome','redAway','event1','event2','event3','event4','event5','match1','match2','match3','match4','match5'];
async function load(){try{s=await fetch('/api/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());draw();status.textContent='● Connected'}catch(e){status.textContent='Connection error'}}
function previewLogo(inputId,imgId){const url=document.getElementById(inputId).value||'';const img=document.getElementById(imgId);img.src=url;img.style.visibility=url?'visible':'hidden'}
function pickLogo(fileInput,targetId,previewId){
 const file=fileInput.files&&fileInput.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{document.getElementById(targetId).value=reader.result;previewLogo(targetId,previewId);status.textContent='Logo loaded — click UPDATE OVERLAY';};
 reader.readAsDataURL(file);
}
function clearLogo(targetId,previewId,fileId){document.getElementById(targetId).value='';document.getElementById(fileId).value='';previewLogo(targetId,previewId)}
function draw(){fields.forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=s[k]??''});hs.textContent=s.homeScore??0;as.textContent=s.awayScore??0;clockBig.textContent=s.clock||'00:00';clockModeLabel.textContent=s.clockMode==='extra'?'EXTRA TIME • 90–120 MIN':'STANDARD 90 MIN';u.textContent=location.origin+'/overlay.html';previewLogo('homeLogo','homeLogoPreview');previewLogo('awayLogo','awayLogoPreview')}
async function post(x){await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});await load()}
async function clockAction(action){try{s=await fetch('/api/clock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})}).then(r=>r.json());draw();status.textContent='● Clock updated'}catch(e){status.textContent='Clock error'}}
function saveAll(){let x={};fields.forEach(k=>{if(k!=='clock')x[k]=document.getElementById(k).value});post(x)}
function goal(k,d){post({[k]:Math.max(0,(+s[k]||0)+d)})}
load();setInterval(load,1000);
</script></body></html>
