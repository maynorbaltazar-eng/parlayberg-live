<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parlayberg LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
:root{--g:#30ff71;--g2:#00c84e;--dark:#050b07;--panel:rgba(3,12,7,.96)}
.stage{width:720px;height:1280px;position:relative;padding:8px 10px;background:linear-gradient(180deg,rgba(0,0,0,.98),rgba(2,10,6,.96) 82%,rgba(0,0,0,0));overflow:hidden}
.frame{border:2px solid var(--g);box-shadow:0 0 14px rgba(48,255,113,.58),inset 0 0 12px rgba(48,255,113,.07);background:linear-gradient(180deg,rgba(7,18,11,.98),rgba(2,9,5,.98))}
.scoreboard{height:150px;display:grid;grid-template-columns:95px 1fr 150px 1fr;align-items:center;border-radius:20px;padding:8px 12px;position:relative}
.clockBox{font-size:28px;font-weight:900;text-align:center;white-space:nowrap}
.team{text-align:center;min-width:0}.team .shield{width:68px;height:68px;margin:0 auto 3px;display:flex;align-items:center;justify-content:center}.shield img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}.shield.fallback{background:linear-gradient(#f4f4f4,#aaa);clip-path:polygon(50% 0,92% 15%,88% 70%,50% 100%,12% 70%,8% 15%);border:3px solid #fff}
.teamName{font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamCards{font-size:12px;margin-top:4px;min-height:18px}.cardCount{display:inline-flex;align-items:center;gap:2px;margin:0 3px;font-weight:900}
.mid{text-align:center}.score{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',Arial,sans-serif;font-size:54px;line-height:.95;text-shadow:0 0 10px #000}.matchstatus{font-size:11px;color:var(--g);font-weight:900;letter-spacing:1px;margin-bottom:4px}.pens{display:none;font-size:11px;color:#ffd84a;font-weight:900;margin-top:5px}
.main{height:325px;margin-top:8px}
.camera{position:relative;width:100%;height:100%;border-radius:18px;background:transparent;border:3px solid var(--g);box-shadow:0 0 16px rgba(48,255,113,.65),inset 0 0 0 4px rgba(0,0,0,.45);overflow:hidden}
.camera:before{content:"LIVE REACTION";position:absolute;z-index:5;top:7px;left:50%;transform:translateX(-50%);background:#07110b;border:1px solid var(--g);padding:4px 20px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.cam-hole{position:absolute;left:10px;right:10px;top:34px;bottom:10px;border:1px solid rgba(255,255,255,.16);border-radius:12px;z-index:2;pointer-events:none}
.lower{margin-top:8px;height:500px}.sportsbookBoard{height:100%;border-radius:18px;padding:8px;overflow:hidden}
.predBrandWide{height:145px;overflow:hidden;border-radius:14px;margin-bottom:8px;border:1px solid rgba(48,255,113,.5);box-shadow:0 0 14px rgba(48,255,113,.32);background:#020704}.predBrandWide img{width:100%;height:100%;object-fit:cover;object-position:center 40%;transform:scale(1.14);transform-origin:center}
.sportsHead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;margin:3px 4px 5px}.sportsHead>div:last-child{color:var(--g)}
.slipProgress{height:7px;background:#1d3024;border-radius:999px;overflow:hidden;margin:0 4px 6px}.slipProgress>div{height:100%;background:var(--g);width:0}
.sportsRow{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:8px 10px;margin:7px 4px 0;min-height:104px}
.sportsTop{display:grid;grid-template-columns:48px 1fr auto auto;gap:9px;align-items:center}
.flagStack{display:flex;flex-direction:column;gap:3px;align-items:center}.flagSlot{width:42px;height:29px;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#142018;font-size:25px}.flagSlot img{width:100%;height:100%;object-fit:cover}
.sportsMatch{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sportsStatus{background:#d61f35;padding:5px 8px;border-radius:7px;font-size:13px;font-weight:900;white-space:nowrap}.sportsScore{font-size:16px;font-weight:900;background:#223028;border-radius:6px;padding:5px 8px;color:#fff;white-space:nowrap}
.sportsPickLine{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;margin-top:4px}.marketIcon{width:30px;height:30px;border-radius:8px;background:#26342b;display:flex;align-items:center;justify-content:center;color:#d9e6dc;font-weight:900;margin:auto}.sportsPick{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sportsPct{font-size:17px;font-weight:900;color:var(--g);text-align:right}
.sportsProgress{height:8px;background:#334238;border-radius:999px;overflow:visible;margin:6px 66px 0 57px;position:relative}.sportsProgress>div{height:100%;background:var(--g);border-radius:999px}.targetMarker{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:#111;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(255,255,255,.35)}
.sportsMeta{font-size:9px;color:#c9d3cd;margin:3px 66px 0 57px;display:flex;justify-content:space-between}.sportsRow.hit{box-shadow:inset 0 0 0 1px rgba(48,255,113,.35)}.sportsRow.lost{opacity:.65}.sportsRow.lost .sportsProgress>div{background:#d44}.pageDots{font-size:9px;color:#9cb0a2;text-align:center;margin-top:4px}
</style></head><body>
<div class="stage">
<div class="scoreboard frame">
  <div id="clock" class="clockBox">00:00</div>

  <div class="team">
    <div id="homeShield" class="shield fallback">
      <img id="homeLogoImg" alt="">
    </div>
    <div id="h" class="teamName">HOME TEAM</div>
    <div id="homeCards" class="teamCards"></div>
  </div>

  <div class="mid">
    <div id="matchStatus" class="matchstatus">PRE</div>
    <div class="score">
      <span id="hs">0</span> - <span id="as">0</span>
    </div>
    <div id="pens" class="pens">
      PENS <span id="phs">0</span> - <span id="pas">0</span>
    </div>
  </div>

  <div class="team">
    <div id="awayShield" class="shield fallback">
      <img id="awayLogoImg" alt="">
    </div>
    <div id="a" class="teamName">AWAY TEAM</div>
    <div id="awayCards" class="teamCards"></div>
  </div>
</div>

<div class="main"><div class="camera"><div class="cam-cover-top"></div><div class="cam-hole"></div><div class="cam-cover-bottom"></div></div></div>
<div class="lower">
<div class="matches frame sportsbookBoard">
  <div class="predBrandWide"><img src="/bergpicks-header.jpg.png" alt="BergPicks"></div>
  <div class="sportsHead"><div>BERGPICKS LIVE PICKS</div><div id="slipCount">0 / 0 HIT</div></div>
  <div class="slipProgress"><div id="slipBar"></div></div>
  <div id="sportsRows"></div>
  <div id="pageDots" class="pageDots"></div>
</div>
</div>

</div>

<script>
async function draw(){try{
let s=await fetch('/api/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
const set=(id,v)=>document.getElementById(id).textContent=v??'';
set('h',s.homeTeam);set('a',s.awayTeam);set('hs',s.homeScore);set('as',s.awayScore);set('clock',s.clock);set('matchStatus',s.matchStatus||'');set('phs',s.penaltyHome||0);set('pas',s.penaltyAway||0);document.getElementById('pens').style.display=s.penaltyMode?'block':'none';
const setLogo=(imgId,shieldId,url)=>{const img=document.getElementById(imgId),sh=document.getElementById(shieldId);if(url){img.src=url;img.style.display='block';sh.classList.remove('fallback');img.onerror=()=>{img.style.display='none';sh.classList.add('fallback')}}else{img.removeAttribute('src');img.style.display='none';sh.classList.add('fallback')}};
setLogo('homeLogoImg','homeShield',s.homeLogo);setLogo('awayLogoImg','awayShield',s.awayLogo);
const cardHtml=(y,r)=>(+y?'<span class="cardCount">🟨 '+y+'</span>':'')+(+r?'<span class="cardCount">🟥 '+r+'</span>':'');
document.getElementById('homeCards').innerHTML=cardHtml(s.yellowHome,s.redHome);
document.getElementById('awayCards').innerHTML=cardHtml(s.yellowAway,s.redAway);
const enabled=[];let hitCount=0;
for(let i=1;i<=8;i++){if(s['pred'+i+'Enabled'])enabled.push(i)}
const pageSize=3,pageCount=Math.max(1,Math.ceil(enabled.length/pageSize)),page=Math.floor(Date.now()/7000)%pageCount,start=page*pageSize,visible=enabled.slice(start,start+pageSize);
const rows=document.getElementById('sportsRows');rows.innerHTML='';
for(const i of enabled){
  const cur=+(s['pred'+i+'Current']||0),tar=+(s['pred'+i+'Target']||0),mode=s['pred'+i+'Result']||'AUTO';
  const autoPct=tar>0?Math.max(0,Math.min(100,cur/tar*100)):0;
  const override=s['pred'+i+'Percent'];
  const pct=(override!==''&&override!=null)?Math.max(0,Math.min(100,+override||0)):autoPct;
  const st=mode==='AUTO'?(tar>0&&cur>=tar?'HIT':'PENDING'):mode;
  if(st==='HIT')hitCount++;
}
for(const i of visible){
  const cur=+(s['pred'+i+'Current']||0),tar=+(s['pred'+i+'Target']||0),mode=s['pred'+i+'Result']||'AUTO';
  const autoPct=tar>0?Math.max(0,Math.min(100,cur/tar*100)):0;
  const override=s['pred'+i+'Percent'];
  const pct=(override!==''&&override!=null)?Math.max(0,Math.min(100,+override||0)):autoPct;
  const st=mode==='AUTO'?(tar>0&&cur>=tar?'HIT':'PENDING'):mode;
  const row=document.createElement('div');row.className='sportsRow '+(st==='HIT'?'hit':st==='LOST'?'lost':'');
  const icon1=s['pred'+i+'Icon']||'⚽',icon2=s['pred'+i+'Icon2']||'',match=s['pred'+i+'Match']||('MATCH '+i),status=s['pred'+i+'Status']||'LIVE',hs=s['pred'+i+'HomeScore']??0,as=s['pred'+i+'AwayScore']??0;
  const market=s['pred'+i+'Market']||'',pick=s['pred'+i+'Pick']||'',odds=s['pred'+i+'Odds']?(' • '+s['pred'+i+'Odds']):'';
  const renderIcon=v=>/^https?:|^data:image\//.test(v)?('<img src="'+v+'" alt="">'):v;
  const markerPct=Math.max(3,Math.min(97,pct));
  row.innerHTML='<div class="sportsTop"><div class="flagStack"><div class="flagSlot">'+renderIcon(icon1)+'</div>'+(icon2?'<div class="flagSlot">'+renderIcon(icon2)+'</div>':'')+'</div><div class="sportsMatch">'+match+'</div><div class="sportsStatus">'+status+'</div><div class="sportsScore">'+hs+' &nbsp; '+as+'</div></div><div class="sportsPickLine"><div class="marketIcon">'+(st==='HIT'?'✓':st==='LOST'?'✕':'%')+'</div><div class="sportsPick">'+pick+'<div style="font-size:11px;font-weight:500;color:#c9d3cd;margin-top:1px">'+market+odds+'</div></div><div class="sportsPct">'+Math.round(pct)+'%</div></div><div class="sportsProgress"><div style="width:'+(st==='HIT'?100:pct)+'%"></div><div class="targetMarker" style="left:'+markerPct+'%">'+(cur||0)+'</div></div><div class="sportsMeta"><span>0</span><span>Target '+tar+' '+(s['pred'+i+'Unit']||'')+' • '+st+'</span></div>';
  rows.appendChild(row);
}
set('slipCount',hitCount+' / '+enabled.length+' HIT');document.getElementById('slipBar').style.width=(enabled.length?Math.round(hitCount/enabled.length*100):0)+'%';set('pageDots',pageCount>1?('PICKS '+(start+1)+'-'+Math.min(start+pageSize,enabled.length)+' OF '+enabled.length):'');
}catch(e){}}
draw();setInterval(draw,700);
</script></body></html>
