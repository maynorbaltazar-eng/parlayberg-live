<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parlayberg LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',Arial,sans-serif;color:#fff;overflow:hidden}
:root{--g:#30ff71;--g2:#00c84e;--dark:#050b07;--panel:rgba(3,12,7,.95)}
.stage{width:720px;height:1280px;position:relative;padding:12px;background:
radial-gradient(circle at 50% -10%,rgba(39,255,104,.22),transparent 34%),
linear-gradient(180deg,rgba(0,0,0,.98),rgba(2,11,6,.96));overflow:hidden}
.stage:before{content:"";position:absolute;inset:0;background:
linear-gradient(115deg,transparent 0 46%,rgba(48,255,113,.035) 46% 47%,transparent 47%),
repeating-linear-gradient(0deg,transparent 0 44px,rgba(48,255,113,.018) 45px);pointer-events:none}
.frame{border:2px solid var(--g);box-shadow:0 0 12px rgba(48,255,113,.55),inset 0 0 12px rgba(48,255,113,.08);background:linear-gradient(180deg,rgba(7,18,11,.97),rgba(2,9,5,.97))}
.hero{height:180px;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;width:210px;height:210px;top:0;border-radius:50%;filter:blur(6px);opacity:.24;background:radial-gradient(circle,var(--g),transparent 65%)}
.hero:before{left:-70px}.hero:after{right:-70px}.mount{position:absolute;top:20px;font-size:90px;opacity:.12;letter-spacing:-20px;color:var(--g)}
.crown{font-size:28px;line-height:1;margin-bottom:0}.brand{font-size:52px;font-style:italic;letter-spacing:-2px;text-shadow:0 0 12px #000,0 0 18px var(--g2);transform:skew(-6deg)}
.livepill{display:inline-block;margin-top:3px;padding:5px 22px;border:2px solid var(--g);border-radius:8px;background:#031507;box-shadow:0 0 16px var(--g2);font-family:Arial,sans-serif;font-weight:900;font-size:26px;letter-spacing:2px}
.livepill .dot{color:#ff2323}.sub{font-family:Arial,sans-serif;font-size:10px;letter-spacing:5px;margin-top:8px}
.scoreboard{height:114px;display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;border-radius:8px;padding:8px 14px;margin-top:2px}
.team{font-size:22px;text-align:center}.teamCards{font-family:Arial,sans-serif;font-size:12px;margin-top:3px;min-height:16px}.cardCount{display:inline-flex;align-items:center;gap:2px;margin:0 3px;font-weight:900}.shield{width:64px;height:64px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}.shield img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}.shield.fallback{background:linear-gradient(#f4f4f4,#aaa);clip-path:polygon(50% 0,92% 15%,88% 70%,50% 100%,12% 70%,8% 15%);border:3px solid #fff}
.mid{text-align:center}.score{font-size:54px;line-height:.9;text-shadow:0 0 10px #000}.matchstatus{font-family:Arial,sans-serif;font-size:10px;color:var(--g);font-weight:900;letter-spacing:1px;margin-bottom:3px}.pens{display:none;font-family:Arial,sans-serif;font-size:11px;color:#ffd84a;font-weight:900;margin-top:4px}.clock{margin-top:6px;display:inline-block;border:2px solid var(--g);padding:4px 17px;border-radius:8px;color:#fff;background:#07140c;font-family:Arial,sans-serif;font-weight:900}
.main{display:block;height:455px;margin-top:9px}
.camera{position:relative;width:100%;height:100%;border-radius:6px;background:transparent;border:3px solid var(--g);box-shadow:0 0 14px rgba(48,255,113,.65),inset 0 0 0 5px rgba(0,0,0,.6);overflow:hidden}
.camera:before{content:"LIVE REACTION";position:absolute;z-index:5;top:-15px;left:50%;transform:translateX(-50%);background:#07110b;border:2px solid var(--g);padding:5px 24px;border-radius:5px;font-family:Arial,sans-serif;font-size:13px;font-weight:900;white-space:nowrap}
.cam-hole{position:absolute;left:14px;right:14px;top:96px;aspect-ratio:16/9;border:2px solid rgba(255,255,255,.22);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(48,255,113,.25);z-index:2;pointer-events:none}
.cam-cover-top,.cam-cover-bottom{position:absolute;left:0;right:0;background:linear-gradient(180deg,rgba(3,12,7,.98),rgba(3,12,7,.93));z-index:1;pointer-events:none}
.cam-cover-top{top:0;height:88px}
.cam-cover-bottom{left:10px;right:10px;bottom:10px;height:84px;border-radius:0 0 4px 4px}
.side{display:block}.panel{border-radius:6px;padding:10px}.ptitle{font-size:21px;color:#fff;margin-bottom:7px}.ptitle span{color:var(--g)}.predPanel{height:455px;overflow:hidden}.predBrandWrap{position:relative;margin:-2px -2px 8px;border-radius:8px;overflow:hidden;border:1px solid rgba(48,255,113,.75);box-shadow:0 0 12px rgba(48,255,113,.45);animation:bergGlow 2.8s ease-in-out infinite}.predBrandImg{display:block;width:100%;height:88px;object-fit:cover}.predBrandFallback{display:none;height:88px;line-height:88px;text-align:center;font-size:28px;font-style:italic;color:var(--g);text-shadow:0 0 12px var(--g2);background:linear-gradient(180deg,#07110b,#031507)}@keyframes bergGlow{0%,100%{box-shadow:0 0 10px rgba(48,255,113,.35)}50%{box-shadow:0 0 22px rgba(48,255,113,.8)}}.slipTop{display:flex;justify-content:space-between;align-items:center;font-family:Arial,sans-serif;margin-bottom:6px}.slipLabel{font-size:10px;color:#a9b8ae;font-weight:800}.slipCount{font-size:11px;color:var(--g);font-weight:900}.slipProgress{height:6px;background:#173321;border-radius:999px;overflow:hidden;margin-bottom:7px}.slipProgress>div{height:100%;background:var(--g);width:0}.pageDots{font-family:Arial,sans-serif;font-size:9px;color:#9cb0a2;text-align:center;margin-top:5px}.predRow{border-top:1px solid #1e7440;padding:8px 3px;font-family:Arial,sans-serif}.predMatch{font-size:10px;color:#a9b8ae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.predPickLine{display:flex;justify-content:space-between;gap:5px;align-items:center;margin-top:2px}.predPick{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.predBadge{font-size:9px;font-weight:900;border-radius:4px;padding:2px 5px;background:#183b26;color:#fff}.predBadge.hit{background:#0b8f42}.predBadge.lost{background:#a82424}.predProgress{height:5px;background:#173321;border-radius:999px;overflow:hidden;margin-top:5px}.predProgress>div{height:100%;background:var(--g);width:0}.predMeta{font-size:9px;color:#cad5ce;margin-top:3px}
.strip{height:48px;margin-top:8px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:900;font-size:15px;letter-spacing:.4px}
.lower{margin-top:8px;height:278px}.matches{height:100%;border-radius:6px;padding:8px}.sportsbookBoard{overflow:hidden}.predBrandWide{height:50px;overflow:hidden;border-radius:6px;margin-bottom:5px}.predBrandWide img{width:100%;height:100%;object-fit:cover}.sportsHead{display:flex;justify-content:space-between;align-items:center;font-family:Arial,sans-serif;font-size:12px;font-weight:900;margin:2px 2px 5px}.sportsHead>div:last-child{color:var(--g)}.sportsRow{font-family:Arial,sans-serif;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:7px 9px;margin-top:6px}.sportsTop{display:grid;grid-template-columns:34px 1fr auto auto;gap:7px;align-items:center}.sportsIcon{font-size:25px;text-align:center}.sportsMatch{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sportsStatus{font-size:10px;color:#d2ddd5;font-weight:800}.sportsScore{font-size:14px;font-weight:900;background:#132119;border-radius:5px;padding:3px 7px;color:#fff}.sportsPickLine{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;margin-top:5px}.marketIcon{width:27px;height:27px;border-radius:7px;background:#26342b;display:flex;align-items:center;justify-content:center;color:#d9e6dc;font-weight:900}.sportsPick{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sportsPct{font-size:12px;font-weight:900;color:#dfe8e1}.sportsProgress{height:6px;background:#26372d;border-radius:999px;overflow:hidden;margin:6px 0 1px 41px}.sportsProgress>div{height:100%;background:var(--g);width:0}.sportsMeta{font-size:9px;color:#aebdb3;margin-left:41px}.sportsRow.hit{box-shadow:inset 0 0 0 1px rgba(48,255,113,.35)}.sportsRow.lost{opacity:.65}.sportsRow.lost .sportsProgress>div{background:#d44}.pageDots{font-family:Arial,sans-serif;font-size:9px;color:#9cb0a2;text-align:center;margin-top:4px}
.footer{height:76px;margin-top:8px;border-radius:6px;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;padding:0 18px}.social{font-family:Arial,sans-serif;font-weight:900;font-size:15px;letter-spacing:5px}.footbrand{text-align:center;font-size:32px;font-style:italic}.notify{text-align:right;font-family:Arial,sans-serif;font-size:11px;font-weight:900}
</style></head><body>
<div class="stage">
<div class="hero"><div class="mount">▲▲▲</div><div><div class="crown">♛</div><div class="brand">PARLAYBERG</div><div class="livepill"><span class="dot">●</span> LIVE</div><div class="sub">FOOTBALL MATCH CENTER</div></div></div>

<div class="scoreboard frame">
<div class="team"><div id="homeShield" class="shield fallback"><img id="homeLogoImg" alt=""></div><div id="h">HOME TEAM</div><div id="homeCards" class="teamCards"></div></div>
<div class="mid"><div id="matchStatus" class="matchstatus">PRE</div><div class="score"><span id="hs">0</span> - <span id="as">0</span></div><div id="clock" class="clock">00:00</div><div id="pens" class="pens">PENS <span id="phs">0</span> - <span id="pas">0</span></div></div>
<div class="team"><div id="awayShield" class="shield fallback"><img id="awayLogoImg" alt=""></div><div id="a">AWAY TEAM</div><div id="awayCards" class="teamCards"></div></div>
</div>

<div class="main">
<div class="camera"><div class="cam-cover-top"></div><div class="cam-hole"></div><div class="cam-cover-bottom"></div></div>
<div class="strip frame">⚽ &nbsp; LIVE REACTION &nbsp; • &nbsp; ANALYSIS &nbsp; • &nbsp; SCORES &nbsp; • &nbsp; DAILY PICKS</div>

<div class="lower">
<div class="matches frame sportsbookBoard">
  <div class="predBrandWide"><img src="/bergpicks-header.jpg.png" alt="BergPicks"></div>
  <div class="sportsHead"><div>LIVE PICKS</div><div id="slipCount">0 / 0 HIT</div></div>
  <div class="slipProgress"><div id="slipBar"></div></div>
  <div id="sportsRows"></div>
  <div id="pageDots" class="pageDots"></div>
</div>
</div>

<div class="footer frame"><div class="social">♪ ▶ ◎</div><div class="footbrand">PARLAYBERG</div><div class="notify">🔔 TURN ON<br>NOTIFICATIONS</div></div>
</div>

<script>
async function draw(){try{
let s=await fetch('/api/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
const set=(id,v)=>document.getElementById(id).textContent=v??'';
set('h',s.homeTeam);set('a',s.awayTeam);set('hs',s.homeScore);set('as',s.awayScore);set('clock',s.clock);set('matchStatus',s.matchStatus||'');set('phs',s.penaltyHome||0);set('pas',s.penaltyAway||0);document.getElementById('pens').style.display=s.penaltyMode?'block':'none';
const setLogo=(imgId,shieldId,url)=>{const img=document.getElementById(imgId),sh=document.getElementById(shieldId);if(url){img.src=url;img.style.display='block';sh.classList.remove('fallback');img.onerror=()=>{img.style.display='none';sh.classList.add('fallback')}}else{img.removeAttribute('src');img.style.display='none';sh.classList.add('fallback')}};
setLogo('homeLogoImg','homeShield',s.homeLogo);setLogo('awayLogoImg','awayShield',s.awayLogo);
const cardHtml=(y,r)=>(+y?'<span class="cardCount">🟨 '+y+'</span>':'')+(+r?'<span class="cardCount">🟥 '+r+'</span>':'');
document.getElementById('homeCards').innerHTML=cardHtml(s.yellowHome,s.redHome);
document.getElementById('awayCards').innerHTML=cardHtml(s.yellowAway,s.redAway);
const enabled=[];let hitCount=0;
for(let i=1;i<=8;i++){if(s['pred'+i+'Enabled'])enabled.push(i)}
const pageSize=3,pageCount=Math.max(1,Math.ceil(enabled.length/pageSize)),page=Math.floor(Date.now()/7000)%pageCount,start=page*pageSize,visible=enabled.slice(start,start+pageSize);
const rows=document.getElementById('sportsRows');rows.innerHTML='';
for(const i of enabled){
  const cur=+(s['pred'+i+'Current']||0),tar=+(s['pred'+i+'Target']||0),mode=s['pred'+i+'Result']||'AUTO';
  const autoPct=tar>0?Math.max(0,Math.min(100,cur/tar*100)):0;
  const override=s['pred'+i+'Percent'];
  const pct=(override!==''&&override!=null)?Math.max(0,Math.min(100,+override||0)):autoPct;
  const st=mode==='AUTO'?(tar>0&&cur>=tar?'HIT':'PENDING'):mode;
  if(st==='HIT')hitCount++;
}
for(const i of visible){
  const cur=+(s['pred'+i+'Current']||0),tar=+(s['pred'+i+'Target']||0),mode=s['pred'+i+'Result']||'AUTO';
  const autoPct=tar>0?Math.max(0,Math.min(100,cur/tar*100)):0;
  const override=s['pred'+i+'Percent'];
  const pct=(override!==''&&override!=null)?Math.max(0,Math.min(100,+override||0)):autoPct;
  const st=mode==='AUTO'?(tar>0&&cur>=tar?'HIT':'PENDING'):mode;
  const row=document.createElement('div');row.className='sportsRow '+(st==='HIT'?'hit':st==='LOST'?'lost':'');
  const icon=s['pred'+i+'Icon']||'⚽',match=s['pred'+i+'Match']||('MATCH '+i),status=s['pred'+i+'Status']||'',hs=s['pred'+i+'HomeScore']??0,as=s['pred'+i+'AwayScore']??0;
  const market=s['pred'+i+'Market']||'',pick=s['pred'+i+'Pick']||'',odds=s['pred'+i+'Odds']?(' • '+s['pred'+i+'Odds']):'';
  row.innerHTML='<div class="sportsTop"><div class="sportsIcon">'+icon+'</div><div class="sportsMatch">'+match+'</div><div class="sportsStatus">'+status+'</div><div class="sportsScore">'+hs+' - '+as+'</div></div><div class="sportsPickLine"><div class="marketIcon">'+(st==='HIT'?'✓':st==='LOST'?'✕':'%')+'</div><div class="sportsPick">'+market+' • '+pick+odds+'</div><div class="sportsPct">'+Math.round(pct)+'%</div></div><div class="sportsProgress"><div style="width:'+(st==='HIT'?100:pct)+'%"></div></div><div class="sportsMeta">'+cur+' / '+tar+' '+(s['pred'+i+'Unit']||'')+' • '+st+'</div>';
  rows.appendChild(row);
}
set('slipCount',hitCount+' / '+enabled.length+' HIT');document.getElementById('slipBar').style.width=(enabled.length?Math.round(hitCount/enabled.length*100):0)+'%';set('pageDots',pageCount>1?('PICKS '+(start+1)+'-'+Math.min(start+pageSize,enabled.length)+' OF '+enabled.length):'');
}catch(e){}}
draw();setInterval(draw,700);
</script></body></html>
